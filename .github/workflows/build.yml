name: Build Nugget

on:
  workflow_dispatch:
    inputs:
      build_for_macos_intel:
        description: 'Build macOS Intel'
        required: false
        default: true
        type: boolean
      build_for_macos_arm:
        description: 'Build macOS ARM'
        required: false
        default: true
        type: boolean
      build_for_windows:
        description: 'Build Windows'
        required: false
        default: true
        type: boolean
      build_for_linux:
        description: 'Build Linux'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

jobs:
  build-macos-intel:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_for_macos_intel == 'true' }}
    runs-on: macos-12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install -U pip
          pip install -r requirements.txt

      - name: Import macOS signing certificate (optional)
        if: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_CODESIGN_IDENTITY != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm -f cert.p12

      - name: Compile UI/resources (best-effort)
        run: |
          command -v pyside6-uic >/dev/null 2>&1 && pyside6-uic qt/mainwindow.ui -o qt/mainwindow_ui.py || true
          command -v pyside6-rcc >/dev/null 2>&1 && pyside6-rcc resources.qrc -o resources_rc.py || true

      - name: Preflight (compileall)
        run: python3 -m compileall -q main_app.py controllers gui devicemanagement restore tweaks utils

      - name: Build macOS (Intel)
        env:
          NUGGET_CODESIGN_HASH: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: python3 compile.py

      - name: Notarize and staple (optional)
        if: ${{ secrets.APPLE_NOTARY_APPLE_ID != '' && secrets.APPLE_NOTARY_TEAM_ID != '' && secrets.APPLE_NOTARY_PASSWORD != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "dist/Nugget.app" "dist/Nugget.app.notary.zip"
          xcrun notarytool submit "dist/Nugget.app.notary.zip" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait
          xcrun stapler staple "dist/Nugget.app"
          rm -f "dist/Nugget.app.notary.zip"

      - name: Zip Nugget.app (Intel)
        run: |
          cd dist
          zip -r -y "Nugget_macOS_intel.zip" Nugget.app
          shasum -a 256 "Nugget_macOS_intel.zip" > "Nugget_macOS_intel.zip.sha256"

      - name: Upload ZIP (Intel)
        uses: actions/upload-artifact@v4
        with:
          name: Nugget_macOS_intel
          path: |
            dist/Nugget_macOS_intel.zip
            dist/Nugget_macOS_intel.zip.sha256

  build-macos-arm:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_for_macos_arm == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python3 -m pip install -U pip
          pip install -r requirements.txt

      - name: Import macOS signing certificate (optional)
        if: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_CODESIGN_IDENTITY != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          rm -f cert.p12

      - name: Compile UI/resources (best-effort)
        run: |
          command -v pyside6-uic >/dev/null 2>&1 && pyside6-uic qt/mainwindow.ui -o qt/mainwindow_ui.py || true
          command -v pyside6-rcc >/dev/null 2>&1 && pyside6-rcc resources.qrc -o resources_rc.py || true

      - name: Preflight (compileall)
        run: python3 -m compileall -q main_app.py controllers gui devicemanagement restore tweaks utils

      - name: Build macOS (ARM)
        env:
          NUGGET_CODESIGN_HASH: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: python3 compile.py

      - name: Notarize and staple (optional)
        if: ${{ secrets.APPLE_NOTARY_APPLE_ID != '' && secrets.APPLE_NOTARY_TEAM_ID != '' && secrets.APPLE_NOTARY_PASSWORD != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "dist/Nugget.app" "dist/Nugget.app.notary.zip"
          xcrun notarytool submit "dist/Nugget.app.notary.zip" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD" --wait
          xcrun stapler staple "dist/Nugget.app"
          rm -f "dist/Nugget.app.notary.zip"

      - name: Zip Nugget.app (ARM)
        run: |
          cd dist
          zip -r -y "Nugget_macOS_arm.zip" Nugget.app
          shasum -a 256 "Nugget_macOS_arm.zip" > "Nugget_macOS_arm.zip.sha256"

      - name: Upload ZIP (ARM)
        uses: actions/upload-artifact@v4
        with:
          name: Nugget_macOS_arm
          path: |
            dist/Nugget_macOS_arm.zip
            dist/Nugget_macOS_arm.zip.sha256

  build-windows:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_for_windows == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Download ffmpeg (bundled)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $zipUrl = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zipPath = "ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "."
          $dir = Get-ChildItem -Directory | Where-Object { $_.Name -like "ffmpeg-*-essentials_build" } | Select-Object -First 1
          if (-not $dir) { throw "ffmpeg folder not found after unzip" }
          New-Item -ItemType Directory -Force -Path "ffmpeg\\bin" | Out-Null
          Copy-Item -Force -Recurse -Path "$($dir.FullName)\\bin\\*" -Destination "ffmpeg\\bin\\"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Compile UI/resources (best-effort)
        shell: pwsh
        run: |
          if (Get-Command pyside6-uic -ErrorAction SilentlyContinue) { pyside6-uic qt/mainwindow.ui -o qt/mainwindow_ui.py }
          if (Get-Command pyside6-rcc -ErrorAction SilentlyContinue) { pyside6-rcc resources.qrc -o resources_rc.py }

      - name: Preflight (compileall)
        run: python -m compileall -q main_app.py controllers gui devicemanagement restore tweaks utils

      - name: Build Windows
        run: python compile.py

      - name: Zip Nugget (Windows)
        run: |
          cd dist
          Compress-Archive -Path Nugget -DestinationPath Nugget_Windows.zip
          $hash = (Get-FileHash -Algorithm SHA256 Nugget_Windows.zip).Hash.ToLower()
          Set-Content -Encoding ASCII -NoNewline -Path Nugget_Windows.zip.sha256 -Value "$hash  Nugget_Windows.zip"

      - name: Upload ZIP (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: Nugget_Windows
          path: |
            dist/Nugget_Windows.zip
            dist/Nugget_Windows.zip.sha256

  build-linux:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_for_linux == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Compile UI/resources (best-effort)
        run: |
          command -v pyside6-uic >/dev/null 2>&1 && pyside6-uic qt/mainwindow.ui -o qt/mainwindow_ui.py || true
          command -v pyside6-rcc >/dev/null 2>&1 && pyside6-rcc resources.qrc -o resources_rc.py || true

      - name: Preflight (compileall)
        run: python -m compileall -q main_app.py controllers gui devicemanagement restore tweaks utils

      - name: Build Linux
        run: python compile.py

      - name: Tar Nugget (Linux)
        run: |
          cd dist
          tar -cJf Nugget_Linux.tar.xz Nugget
          sha256sum Nugget_Linux.tar.xz > Nugget_Linux.tar.xz.sha256

      - name: Build AppImage (experimental)
        run: |
          set -euo pipefail
          mkdir -p AppDir/usr/bin
          cp -r dist/Nugget AppDir/usr/bin/Nugget
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/Nugget/Nugget" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/nugget.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Nugget
          Exec=Nugget
          Icon=nugget
          Categories=Utility;
          EOF
          # appimagetool expects a PNG icon matching the desktop entry name
          cp credits/small_nugget.png AppDir/nugget.png
          curl -L -o appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage AppDir Nugget_Linux.AppImage
          sha256sum Nugget_Linux.AppImage > Nugget_Linux.AppImage.sha256

      - name: Upload TAR (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: Nugget_Linux
          path: |
            dist/Nugget_Linux.tar.xz
            dist/Nugget_Linux.tar.xz.sha256
            Nugget_Linux.AppImage
            Nugget_Linux.AppImage.sha256

  publish-release:
    if: ${{ github.event_name == 'push' }}
    needs: [build-macos-intel, build-macos-arm, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -maxdepth 3 -type f -print -exec cp -v {} release/ \;
          ls -la release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
